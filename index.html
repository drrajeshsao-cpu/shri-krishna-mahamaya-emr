<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>SKMCIS Platinum Disease Library</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>SKMCIS Platinum Disease Library</h1>
      <p>Mahamaya Clinic • Version 1.0</p>
    </div>
    <button id="installBtn" hidden>Install App</button>
  </header>

  <main>
    <section class="hero">
      <h2>Clinical Knowledge • Ayurveda • Panchakarma • AI Support</h2>
      <p>ऑफ़लाइन खोज, रोग-वार मॉड्यूल, रोगी शिक्षा और क्लिनिकल दस्तावेज़ीकरण।</p>
    </section>

    <section class="controls">
      <input id="search" type="search" placeholder="Disease ID, नाम या मॉड्यूल खोजें…" aria-label="Search" />
      <select id="statusFilter" aria-label="Filter">
        <option value="all">सभी</option>
        <option value="ready">Content ready</option>
        <option value="pending">Import pending</option>
      </select>
    </section>

    <section class="stats" id="stats"></section>
    <section class="grid" id="diseaseGrid" aria-live="polite"></section>
  </main>

  <dialog id="diseaseDialog">
    <button class="close" id="closeDialog" aria-label="Close">×</button>
    <article id="diseaseDetail"></article>
  </dialog>

  <footer>
    <p>Clinical decision support only. अंतिम निर्णय योग्य चिकित्सक द्वारा किया जाए।</p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
